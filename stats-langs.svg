<svg xmlns="http://www.w3.org/2000/svg" width="440" height="112" viewBox="0 0 440 112"><style>.c{animation:ci .8s cubic-bezier(.2,.7,.3,1) both;animation-delay:var(--d,0s)}@keyframes ci{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}.sh{animation:shm 6s linear infinite}@keyframes shm{0%{transform:translateX(-440px)}100%{transform:translateX(440px)}}.br{animation:bp 3.6s ease-in-out infinite}@keyframes bp{0%,100%{stroke-opacity:.5}50%{stroke-opacity:1}}.num{font-family:Verdana,Geneva,sans-serif;font-size:26px;font-weight:bold;fill:#ffffff}.cap{font-family:Consolas,Menlo,monospace;font-size:10.5px;fill:#8f95a0;letter-spacing:1px}.ttl{font-family:Consolas,Menlo,monospace;font-size:11px;fill:#9a9a9a;letter-spacing:2px}.lbl{font-family:Verdana,Geneva,sans-serif;font-size:13px;fill:#e8e8e8}.pct{font-family:Consolas,Menlo,monospace;font-size:11px;fill:#8f95a0}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#14161a"/></linearGradient><linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a02020"/><stop offset="1" stop-color="#d63a3a"/></linearGradient><pattern id="dgrid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern><clipPath id="cp"><rect width="440" height="112" rx="14"/></clipPath></defs><g class="c"><rect width="440" height="112" rx="14" fill="url(#bg)"/><rect width="440" height="112" rx="14" fill="url(#dgrid)"/><g clip-path="url(#cp)"><rect class="sh" x="0" y="0" width="120" height="112" fill="url(#hl)" opacity="0.10" transform="skewX(-18)"/></g><rect class="br" x="0.5" y="0.5" width="439" height="111" rx="14" fill="none" stroke="#4a4f58"/><rect x="0" y="20" width="3" height="72" rx="1.5" fill="#a02020"/><text class="ttl" x="40" y="30">TOP LANGUAGES</text><text class="lbl" x="40" y="48">Python</text><rect x="200" y="38" width="180" height="9" rx="4.5" fill="#22252b" stroke="#3d424b" stroke-width="1"/><rect x="200" y="38" width="141" height="9" rx="4.5" fill="url(#red)"/><text class="pct" x="432" y="48" text-anchor="end">75.0%</text><text class="lbl" x="40" y="75">Jupyter Notebook</text><rect x="200" y="65" width="180" height="9" rx="4.5" fill="#22252b" stroke="#3d424b" stroke-width="1"/><rect x="200" y="65" width="30" height="9" rx="4.5" fill="url(#red)"/><text class="pct" x="432" y="75" text-anchor="end">12.5%</text><text class="lbl" x="40" y="102">HTML</text><rect x="200" y="102" width="180" height="9" rx="4.5" fill="#22252b" stroke="#3d424b" stroke-width="1"/><rect x="200" y="102" width="30" height="9" rx="4.5" fill="url(#red)"/><text class="pct" x="432" y="102" text-anchor="end">12.5%</text></g></svg>
