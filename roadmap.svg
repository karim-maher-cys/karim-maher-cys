<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120"><style>.nd{animation:ci .7s cubic-bezier(.2,.7,.3,1) both;animation-delay:var(--d)}@keyframes ci{0%{transform:translateY(8px);opacity:0}100%{transform:translateY(0);opacity:1}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.25;r:14}50%{opacity:.8;r:17}}.lb{font-family:Verdana,Geneva,sans-serif;font-size:13px;fill:#c9c9c9}.lb2{font-family:Consolas,Menlo,monospace;font-size:10px;letter-spacing:1.5;fill:#8f95a0}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#14161a"/></linearGradient><pattern id="dgrid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern></defs><rect width="900" height="120" rx="16" fill="url(#bg)"/><rect width="900" height="120" rx="16" fill="url(#dgrid)"/><rect x="0.5" y="0.5" width="899" height="119" rx="16" fill="none" stroke="#3d424b"/><line x1="130" y1="46" x2="770" y2="46" stroke="#3d424b" stroke-width="2" stroke-dasharray="2 6"/><g class="nd" style="--d:0.00s"><circle cx="130" cy="46" r="11" fill="#d9d9d9"/><path d="M125 46l3.5 3.5 6.5-7" stroke="#22252b" stroke-width="2.4" fill="none" stroke-linecap="round"/><text class="lb" x="130" y="86" text-anchor="middle">Cybersecurity basics</text><text class="lb2" x="130" y="104" text-anchor="middle">DONE</text></g><g class="nd" style="--d:0.12s"><circle class="pu" cx="343" cy="46" r="14" fill="none" stroke="#e8e8e8" stroke-width="1.6"/><circle cx="343" cy="46" r="7" fill="#e8e8e8"/><text class="lb" x="343" y="86" text-anchor="middle">Kali &amp; HTB labs</text><text class="lb2" x="343" y="104" text-anchor="middle">IN PROGRESS</text></g><g class="nd" style="--d:0.24s"><circle cx="557" cy="46" r="10" fill="#22252b" stroke="#5a5f68" stroke-width="1.6"/><text class="lb" x="557" y="86" text-anchor="middle">First big project</text><text class="lb2" x="557" y="104" text-anchor="middle">UP NEXT</text></g><g class="nd" style="--d:0.36s"><circle cx="770" cy="46" r="10" fill="#22252b" stroke="#5a5f68" stroke-width="1.6"/><text class="lb" x="770" y="86" text-anchor="middle">First job in cyber</text><text class="lb2" x="770" y="104" text-anchor="middle">THE GOAL</text></g></svg>
