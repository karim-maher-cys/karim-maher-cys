<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150"><style>.row{animation:ci .8s cubic-bezier(.2,.7,.3,1) both;animation-delay:var(--d)}@keyframes ci{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}.fill{animation:fw 1.6s cubic-bezier(.25,.7,.3,1) both;animation-delay:var(--d)}@keyframes fw{0%{width:0}100%{width:var(--w)}}.sh{animation:shm 5s linear infinite}@keyframes shm{0%{transform:translateX(-560px)}100%{transform:translateX(560px)}}.lbl{font-family:Verdana,Geneva,sans-serif;font-size:14px;fill:#e8e8e8}.pct{font-family:Consolas,Menlo,monospace;font-size:12px;fill:#8f95a0}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#14161a"/></linearGradient><pattern id="dgrid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern><linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity=".5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a9a9a"/><stop offset="1" stop-color="#e0e0e0"/></linearGradient><clipPath id="cp"><rect width="900" height="150" rx="16"/></clipPath></defs><rect width="900" height="150" rx="16" fill="url(#bg)"/><rect width="900" height="150" rx="16" fill="url(#dgrid)"/><g clip-path="url(#cp)"><rect class="sh" x="0" y="0" width="110" height="150" fill="url(#hl)" opacity="0.08" transform="skewX(-18)"/></g><rect x="0.5" y="0.5" width="899" height="149" rx="16" fill="none" stroke="#3d424b"/><g class="row" style="--d:0.00s"><text class="lbl" x="40" y="34">Kali Linux &amp; Labs</text><text class="pct" x="860" y="34" text-anchor="end">70%</text><rect x="300" y="23" width="560" height="10" rx="5" fill="#22252b" stroke="#3d424b" stroke-width="1"/><rect class="fill" style="--w:392px;--d:0.30s" x="300" y="23" width="392" height="10" rx="5" fill="url(#bar)"/></g><g class="row" style="--d:0.15s"><text class="lbl" x="40" y="74">SQL Injection</text><text class="pct" x="860" y="74" text-anchor="end">65%</text><rect x="300" y="63" width="560" height="10" rx="5" fill="#22252b" stroke="#3d424b" stroke-width="1"/><rect class="fill" style="--w:364px;--d:0.50s" x="300" y="63" width="364" height="10" rx="5" fill="url(#bar)"/></g><g class="row" style="--d:0.30s"><text class="lbl" x="40" y="114">Burp Suite</text><text class="pct" x="860" y="114" text-anchor="end">55%</text><rect x="300" y="103" width="560" height="10" rx="5" fill="#22252b" stroke="#3d424b" stroke-width="1"/><rect class="fill" style="--w:308px;--d:0.70s" x="300" y="103" width="308" height="10" rx="5" fill="url(#bar)"/></g></svg>
