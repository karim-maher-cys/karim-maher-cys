<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150"><style>.row{animation:ci .8s cubic-bezier(.2,.7,.3,1) both;animation-delay:var(--d)}@keyframes ci{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}.sh{animation:shm 5s linear infinite}@keyframes shm{0%{transform:translateX(-560px)}100%{transform:translateX(560px)}}.lbl{font-family:Verdana,Geneva,sans-serif;font-size:14px;fill:#e8e8e8}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#14161a"/></linearGradient><pattern id="dgrid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern><linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity=".5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><clipPath id="cp"><rect width="900" height="150" rx="16"/></clipPath></defs><rect width="900" height="150" rx="16" fill="url(#bg)"/><rect width="900" height="150" rx="16" fill="url(#dgrid)"/><g clip-path="url(#cp)"><rect class="sh" x="0" y="0" width="110" height="150" fill="url(#hl)" opacity="0.08" transform="skewX(-18)"/></g><rect x="0.5" y="0.5" width="899" height="149" rx="16" fill="none" stroke="#3d424b"/><g class="row" style="--d:0.00s"><rect x="40" y="29" width="7" height="7" rx="1.5" fill="#a02020"/><text class="lbl" x="60" y="38">Kali Linux &amp; Labs</text></g><g class="row" style="--d:0.15s"><rect x="40" y="67" width="7" height="7" rx="1.5" fill="#a02020"/><text class="lbl" x="60" y="76">SQL Injection</text></g><g class="row" style="--d:0.30s"><rect x="40" y="105" width="7" height="7" rx="1.5" fill="#a02020"/><text class="lbl" x="60" y="114">Burp Suite</text></g></svg>
